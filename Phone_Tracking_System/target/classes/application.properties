# application.properties
server.port=8087
spring.application.name=phone-tracking-system

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/phone_tracking_db
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Add to application.properties

# Google Maps API Configuration
google.maps.api.key=YOUR_GOOGLE_MAPS_API_KEY_HERE

# Enable HTTPS for production (required by Google Maps)
server.ssl.enabled=false
